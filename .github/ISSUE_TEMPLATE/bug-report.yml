name: Bug report
description: Report a reproducible problem with TableFlow
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. This is a public tracker. Do not include table contents, exported files, email addresses, site URLs, passwords, tokens or other confidential information. Send private details to contact@toosolv.com instead.
  - type: dropdown
    id: export-format
    attributes:
      label: Export option
      options:
        - Excel, Single
        - Excel, ZIP
        - CSV, Single
        - CSV, ZIP
        - The problem happens before export
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the TableFlow error reference if one was shown.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - German
        - French
        - Spanish
        - Japanese
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed confidential information and personal data from this public report.
          required: true
